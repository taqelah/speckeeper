[project]
name = "speckeeper"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "google-adk>=2.12.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "slack-bolt>=1.30.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
speckeeper = "speckeeper:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 160  # the code wraps long lines by meaning, not at 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is the formatter's job
    "RUF001",  # ambiguous unicode in strings: the Slack text uses → and ’ on purpose
    "RUF002",
    "RUF003",
    "SIM108",  # if/else is clearer than a ternary in a few places
    "RUF005",  # list + [x] reads fine
    "RUF017",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
