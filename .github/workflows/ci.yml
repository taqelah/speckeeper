name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit hashes: a moved tag can't change what runs here.
jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Lint (ruff check)
        run: uvx ruff@0.17.0 check --output-format github src tests
      - name: Formatting (ruff format)
        run: uvx ruff@0.17.0 format --check --diff src tests

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - name: Tests
        run: uv run pytest -q --cov=speckeeper --cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY --cov-fail-under=80

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Check dependencies for known vulnerabilities
        run: |
          uv export --no-hashes --no-dev --format requirements-txt | grep -v '^-e\|^\.' > requirements.txt
          uvx pip-audit -r requirements.txt --progress-spinner off
