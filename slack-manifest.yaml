# Slack app manifest for Spec Keeper. Create the app from it at
# https://api.slack.com/apps -> Create New App -> From an app manifest -> paste this.
display_information:
  name: Spec Keeper
  description: Captures what your team agrees on, keeps the PRD and GitHub issues in sync, and proves each requirement in CI.
  background_color: "#2f6fde"
  long_description: Spec Keeper lives in your project channel. Mention it with a link to meeting notes or in a thread, and it extracts the requirements the team agreed on, with acceptance criteria and a link to where each was decided. Nothing is written until someone clicks Approve; then it updates the PRD and opens GitHub issues with keyed criteria. CI results come back per criterion, and when a later message changes an approved requirement, Spec Keeper flags the change and the tests that no longer prove it. Ask it why about any requirement and it answers with sources.
features:
  bot_user:
    display_name: Spec Keeper
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - users:read
settings:
  event_subscriptions:
    request_url: https://speckeeper-193909905599.asia-southeast1.run.app/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://speckeeper-193909905599.asia-southeast1.run.app/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
